name: Android CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
    tags:
      - '*'

jobs:
  createArtifacts:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Read Go version from project
      run: echo "GO_VERSION=$(grep -E "^de\.felixnuesse\.extract\.goVersion=" gradle.properties | cut -d'=' -f2)" >> $GITHUB_ENV
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Set up Go from gradle.properties
      uses: actions/setup-go@v4
      with:
        go-version: '${{env.GO_VERSION}}'
      id: go
    - name: Setup Android SDK/NDK
      uses: android-actions/setup-android@v3
      with:
        # Legacy `tools` is gone from the SDK repo; the action default still requests it and fails.
        packages: 'platform-tools'
    - name: Install NDK from gradle.properties
      run: |
        NDK_VERSION="$(grep -E "^de\.felixnuesse\.extract\.ndkVersion=" gradle.properties | cut -d'=' -f2)"
        sdkmanager "ndk;${NDK_VERSION}"
    - name: Restore debug keystore
      run: |
        mkdir -p ~/.android
        echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
        keytool -list -keystore ~/.android/debug.keystore -storepass android -noprompt
    - name: Build RoundSyncDebug and RoundSync (ciCurrent)
      run: ./gradlew assembleOssDebug assembleOssCiCurrent
    - name: Verify FFmpeg JNI in OSS debug APK (video thumb fallback)
      run: |
        APK=$(ls app/build/outputs/apk/oss/debug/*-oss-arm64-v8a-debug.apk)
        unzip -l "$APK" | grep -q "lib/arm64-v8a/libffmpegJNI.so"
    - name: Verify FFmpeg JNI in OSS ciCurrent APK
      run: |
        APK=$(ls app/build/outputs/apk/oss/ciCurrent/*-oss-arm64-v8a-ciCurrent.apk)
        unzip -l "$APK" | grep -q "lib/arm64-v8a/libffmpegJNI.so"
    - name: Verify debug APK signature
      run: |
        APK=$(ls app/build/outputs/apk/oss/debug/*-oss-arm64-v8a-debug.apk)
        $ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools/ | tail -1)/apksigner verify --print-certs "$APK" | grep "SHA-256"
    - name: Verify ciCurrent APK signature
      run: |
        APK=$(ls app/build/outputs/apk/oss/ciCurrent/*-oss-arm64-v8a-ciCurrent.apk)
        $ANDROID_SDK_ROOT/build-tools/$(ls $ANDROID_SDK_ROOT/build-tools/ | tail -1)/apksigner verify --print-certs "$APK" | grep "SHA-256"
    - name: Upload RoundSyncDebug APK (arm64)
      uses: actions/upload-artifact@v4
      with:
        name: roundsync-debug-arm64
        path: ${{ github.workspace }}/app/build/outputs/apk/oss/debug/*-oss-arm64-v8a-debug.apk
        retention-days: 14
    - name: Upload RoundSync current APK (arm64)
      uses: actions/upload-artifact@v4
      with:
        name: roundsync-current-arm64
        path: ${{ github.workspace }}/app/build/outputs/apk/oss/ciCurrent/*-oss-arm64-v8a-ciCurrent.apk
        retention-days: 14
